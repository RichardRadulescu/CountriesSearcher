<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Countries</title>
        <link rel="icon" type="image/png" href="../resources/favicon.png">
        <!--<link rel="stylesheet" href="../Css/style.css"> -->
        <script type="module" src="../Js/App.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light d-flex align-items-center ms-3">
                <div class="me-auto">
                    <i class="bi bi-globe2 fs-3"></i>
                </div>
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Countries</a>
                </div>
        </nav>        

        <button class="btn btn-primary position-sticky top-0 d-flex align-items-center" data-bs-toggle="offcanvas" data-bs-target="#myAside"> 
                    <i class="bi bi-list"></i>
                    <span>Options</span>
                    
        </button>
        <aside class="offcanvas offcanvas-start" tabindex="-1" id="myAside" data-bs-scroll="true"  data-bs-backdrop="true" >
            
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>

            <div class="offcanvas-body">
                <ol class="list-group list-group-flush">
                    <li class="list-group">
                        <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#preferedCountriesModal">
                            Preferred Countries
                        </button>
                    </li>
                    <li class="list-group">

                    </li>
                </ol>
                
            </div>

        </aside>
        
        <main class="container mt-4">
            <form id="id-search-form" class="mb-3">
                <div id="id-history-section" class="mb-3">
                    <p class="fw-semibold">Recent Searches</p>
                    <div id="id-history" class="d-flex flex-wrap gap-2"></div>
                </div>

                <div class="input-group mb-3">
                    <input 
                    id="id-input-search" 
                    type="text" 
                    class="form-control" 
                    autocomplete="off"
                    placeholder="Search for a country..."
                    />
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-search"></i>
                        <span>Search</span></button>
                </div>

                <div id="suggestions" class="list-group position-absolute w-100"></div>
            </form>

            <div id="id-spinner" class="spinner-border text-primary d-none"></div>

            <div id="id-countries" class="row gy-3"></div>



            <div class="modal fade" id="preferedCountriesModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Preferred Countries</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="id-prefered">
                    <!-- Preferred countries will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
                </div>
            </div>
            </div>

        </main>
    </body>
</html>
