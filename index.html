<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Countries</title>
        <link rel="icon" type="image/png" href="../resources/favicon.png">
        <!--<link rel="stylesheet" href="../Css/style.css"> -->
        <script type="module" src="../Js/App.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Countries</a>
            </div>
        </nav>
        <main class="container mt-4">
            <form id="id-search-form" class="mb-3">
                <div id="id-history-section" class="mb-3">
                    <p class="fw-semibold">Recent Searches</p>
                    <div id="id-history" class="d-flex flex-wrap gap-2"></div>
                </div>

                <div class="input-group mb-3">
                    <input 
                    id="id-input-search" 
                    type="text" 
                    class="form-control" 
                    autocomplete="off"
                    placeholder="Search for a country..."
                    />
                    <button class="btn btn-primary" type="submit">Search</button>
                </div>

                <div id="suggestions" class="list-group position-absolute w-100"></div>
            </form>

            <div id="id-spinner" class="spinner-border text-primary d-none"></div>

            <div id="id-countries" class="row gy-3"></div>

        </main>
    </body>
</html>
