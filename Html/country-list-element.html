<li class="country-item">
  <div class="country-header">
    <button class="prefer-btn" data-action="prefer" title="Add to favorites">★</button>
    <h2 data-field="name"></h2>
  </div>
  <img data-field="flag" width="80">

  <p><strong>Region:</strong> <span data-field="region"></span></p>
  <p><strong>Capital:</strong> <span data-field="capital"></span></p>
  <p><strong>Population:</strong> <span data-field="population"></span></p>
  <p><strong>Languages:</strong> <span data-field="languages"></span></p>
  <p><strong>Timezones:</strong> <span data-field="timezones"></span></p>
</li>
